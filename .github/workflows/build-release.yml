name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\GrimDawnOptimizer.sln

      - name: Build
        run: dotnet build .\GrimDawnOptimizer.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\GrimDawnOptimizer.sln -c Release --no-build --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/GrimDawnOptimizer.Desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: src/GrimDawnOptimizer.Desktop
        run: npm ci

      - name: Build and simulate native trainer helpers
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src/GrimDawnOptimizer.Desktop/scripts/prepare-trainer-native.ps1 -RunTests

      - name: Build Tauri desktop application
        working-directory: src/GrimDawnOptimizer.Desktop
        run: npm run tauri:build -- --no-bundle

      - name: Test desktop bridge transport
        working-directory: src/GrimDawnOptimizer.Desktop/src-tauri
        run: cargo test --locked

      - name: Verify frontend snapshot ordering
        run: node tests/desktop-bridge/state-order.mjs

      - name: Verify development transport boundaries
        run: node tests/desktop-bridge/dev-transport.mjs

      - name: Verify large state event delivery
        run: node tests/desktop-bridge/sse-backpressure.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke test calculation engine protocol
        run: python tests/desktop-bridge/smoke.py

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/GrimDawnOptimizer.Desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: src/GrimDawnOptimizer.Desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: src/GrimDawnOptimizer.Desktop
        run: npm run tauri:build

      - name: Package portable application
        working-directory: src/GrimDawnOptimizer.Desktop
        run: npm run desktop:portable

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_PACKAGE: ${{ github.workspace }}\artifacts\tauri-win-x64.zip
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          }

          $installer = Get-ChildItem -LiteralPath '.\src\GrimDawnOptimizer.Desktop\src-tauri\target\release\bundle\nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Tauri installer was not created.' }
          gh release create $env:GITHUB_REF_NAME $env:PORTABLE_PACKAGE $installer.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
