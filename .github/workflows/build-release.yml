name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\GrimDawnOptimizer.sln

      - name: Build
        run: dotnet build .\GrimDawnOptimizer.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\GrimDawnOptimizer.sln -c Release --no-build --no-restore

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore application dependencies
        run: dotnet restore .\src\GrimDawnOptimizer.App\GrimDawnOptimizer.App.csproj --runtime win-x64

      - name: Publish Windows x64 application
        run: >-
          dotnet publish .\src\GrimDawnOptimizer.App\GrimDawnOptimizer.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .\artifacts\win-x64

      - name: Create release archive
        id: package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "artifacts\GrimDawnOptimizer-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path ".\artifacts\win-x64\*" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          }

          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ARCHIVE `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
