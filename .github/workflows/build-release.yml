name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release promotes a completed main build; it never cancels or rebuilds it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ci:
    name: Build and test
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml

  main:
    name: Build and stage release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ github.repository }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-windows.yml
    with:
      stage-release: true

  release:
    name: Publish GitHub release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-assets-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Find verified main build for this commit
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            const findBuild = require('./.github/scripts/find-release-build.cjs');
            await findBuild({ github, context, core });

      - name: Download verified portable EXE from its draft
        if: steps.build.outputs.already-published != 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.build.outputs.release-id }}
          RELEASE_ASSET_ID: ${{ steps.build.outputs.asset-id }}
          RELEASE_BUILD_RUN_ID: ${{ steps.build.outputs.run-id }}
        with:
          script: |
            const download = require('./.github/scripts/download-release-build.cjs');
            await download({ github, context, core });

      - name: Verify commit, version and package checksum
        if: steps.build.outputs.already-published != 'true'
        env:
          RELEASE_BUILD_RUN_ID: ${{ steps.build.outputs.run-id }}
        run: node .github/scripts/release-artifacts.mjs verify

      - name: Publish verified portable EXE
        if: steps.build.outputs.already-published != 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_BUILD_RUN_ID: ${{ steps.build.outputs.run-id }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-release.cjs');
            await publish({ github, context, core });
