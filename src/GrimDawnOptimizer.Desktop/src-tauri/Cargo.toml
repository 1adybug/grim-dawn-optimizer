[package]
name = "grim-dawn-optimizer"
version = "1.0.21"
description = "Grim Dawn equipment optimizer and single-player companion"
authors = ["Grim Dawn Optimizer contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace]
members = ["crates/bridge-protocol"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grim-dawn-bridge-protocol = { path = "crates/bridge-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
