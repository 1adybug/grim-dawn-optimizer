[package]
name = "grim-dawn-optimizer"
version = "1.0.24"
description = "Grim Dawn equipment optimizer and single-player companion"
authors = ["Grim Dawn Optimizer contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace]
members = ["crates/bridge-protocol", "crates/portable-launcher"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grim-dawn-bridge-protocol = { path = "crates/bridge-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-updater = "2"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
